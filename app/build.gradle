plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.handshake'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.handshake"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    // MediaPipe Tasks Vision
    implementation 'com.google.mediapipe:tasks-vision:0.10.0'

    // Nearby Connections (Google Play Services)
    implementation 'com.google.android.gms:play-services-nearby:18.0.0'

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.2"

    // For Glassmorphism UI (we'll use RenderEffect for blur on Android 12+, but we need to handle fallback)
    // No extra dependency needed for RenderEffect, it's in Android SDK.

    // For logging
    implementation 'com.github.tony19:logback-android-classic:1.1.1-6'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}